<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1780 1150" width="100%" height="100%" style="background-color: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <style>
      .title { fill: #f8fafc; font-size: 24px; font-weight: 700; }
      .subtitle { fill: #94a3b8; font-size: 14px; }
      .entity-header { font-size: 15px; font-weight: 700; fill: #ffffff; }
      .pk { fill: #f59e0b; font-weight: 600; font-size: 12px; }
      .fk { fill: #38bdf8; font-weight: 600; font-size: 12px; }
      .attr { fill: #e2e8f0; font-size: 12px; }
      .type { fill: #64748b; font-size: 11px; font-family: 'SFMono-Regular', Consolas, monospace; }
      .rel-line { stroke: #64748b; stroke-width: 2; fill: none; stroke-dasharray: 4,4; }
      .rel-line-solid { stroke: #38bdf8; stroke-width: 2; fill: none; }
      .rel-label { fill: #94a3b8; font-size: 11px; font-weight: 500; }
      .card-label { fill: #38bdf8; font-size: 12px; font-weight: bold; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8" />
    </marker>
  </defs>

  <!-- Title Block -->
  <text x="50" y="45" class="title">Duolingo Language Learning — Entity-Relationship (ER) Diagram</text>
  <text x="50" y="70" class="subtitle">PostgreSQL 15+ Schema Design · 11 Relational Entities · Constraints &amp; Cardinalities</text>

  <!-- Legend -->
  <g transform="translate(1320, 25)">
    <rect width="400" height="48" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="20" cy="24" r="5" fill="#f59e0b"/>
    <text x="32" y="28" fill="#cbd5e1" font-size="12px">Primary Key (PK)</text>
    <circle cx="155" cy="24" r="5" fill="#38bdf8"/>
    <text x="167" y="28" fill="#cbd5e1" font-size="12px">Foreign Key (FK)</text>
    <line x1="285" y1="24" x2="315" y2="24" stroke="#38bdf8" stroke-width="2"/>
    <text x="325" y="28" fill="#cbd5e1" font-size="12px">1 : N Relationship</text>
  </g>

  <!-- RELATIONSHIP PATHS (Underneath tables) -->
  
  <!-- languages -> courses (from_lang & learning_lang) -->
  <path d="M 310, 160 L 380, 160" class="rel-line-solid" marker-end="url(#arrow)"/>
  <text x="325" y="150" class="card-label">1</text>
  <text x="360" y="150" class="card-label">N</text>

  <!-- courses -> units -->
  <path d="M 640, 175 L 720, 175" class="rel-line-solid" marker-end="url(#arrow)"/>
  <text x="655" y="165" class="card-label">1</text>
  <text x="700" y="165" class="card-label">N</text>

  <!-- units -> lessons -->
  <path d="M 980, 175 L 1060, 175" class="rel-line-solid" marker-end="url(#arrow)"/>
  <text x="995" y="165" class="card-label">1</text>
  <text x="1040" y="165" class="card-label">N</text>

  <!-- lessons -> lesson_attempts -->
  <path d="M 1190, 275 L 1190, 390" class="rel-line-solid" marker-end="url(#arrow)"/>
  <text x="1200" y="295" class="card-label">1</text>
  <text x="1200" y="380" class="card-label">N</text>

  <!-- courses -> enrollments -->
  <path d="M 510, 260 L 510, 390" class="rel-line-solid" marker-end="url(#arrow)"/>
  <text x="520" y="280" class="card-label">1</text>
  <text x="520" y="380" class="card-label">N</text>

  <!-- learners -> enrollments -->
  <path d="M 720, 480 L 640, 480" class="rel-line-solid" marker-end="url(#arrow)"/>
  <text x="700" y="470" class="card-label">1</text>
  <text x="655" y="470" class="card-label">N</text>

  <!-- learners -> lesson_attempts -->
  <path d="M 980, 480 L 1060, 480" class="rel-line-solid" marker-end="url(#arrow)"/>
  <text x="995" y="470" class="card-label">1</text>
  <text x="1040" y="470" class="card-label">N</text>

  <!-- learners -> daily_activity -->
  <path d="M 750, 680 L 750, 720 L 510, 720 L 510, 780" class="rel-line-solid" marker-end="url(#arrow)"/>
  <text x="760" y="705" class="card-label">1</text>
  <text x="520" y="770" class="card-label">N</text>

  <!-- learners -> league_memberships -->
  <path d="M 850, 680 L 850, 780" class="rel-line-solid" marker-end="url(#arrow)"/>
  <text x="860" y="705" class="card-label">1</text>
  <text x="860" y="770" class="card-label">N</text>

  <!-- learners -> learner_achievements -->
  <path d="M 950, 680 L 950, 720 L 1190, 720 L 1190, 780" class="rel-line-solid" marker-end="url(#arrow)"/>
  <text x="960" y="705" class="card-label">1</text>
  <text x="1200" y="770" class="card-label">N</text>

  <!-- achievements -> learner_achievements -->
  <path d="M 1420, 850 L 1320, 850" class="rel-line-solid" marker-end="url(#arrow)"/>
  <text x="1400" y="840" class="card-label">1</text>
  <text x="1335" y="840" class="card-label">N</text>

  <!-- learners self reference (referred_by) -->
  <path d="M 980, 430 C 1030, 410 1030, 360 920, 360 C 870, 360 860, 375 860, 390" class="rel-line-solid" marker-end="url(#arrow)"/>
  <text x="940" y="350" class="rel-label">referred_by (1 : N)</text>


  <!-- ENTITY CARDS -->

  <!-- 1. LANGUAGES -->
  <g transform="translate(50, 100)" filter="url(#shadow)">
    <rect width="260" height="135" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <path d="M 0 0 h 260 v 36 h -260 z" fill="#1d4ed8" rx="8"/>
    <text x="15" y="24" class="entity-header">languages</text>
    <text x="15" y="60" class="pk">PK  language_code</text>
    <text x="175" y="60" class="type">VARCHAR(5)</text>
    <line x1="15" y1="72" x2="245" y2="72" stroke="#334155" stroke-width="1"/>
    <text x="15" y="95" class="attr">    language_name</text>
    <text x="175" y="95" class="type">VARCHAR(50)</text>
  </g>

  <!-- 2. COURSES -->
  <g transform="translate(380, 100)" filter="url(#shadow)">
    <rect width="260" height="190" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <path d="M 0 0 h 260 v 36 h -260 z" fill="#1d4ed8" rx="8"/>
    <text x="15" y="24" class="entity-header">courses</text>
    <text x="15" y="60" class="pk">PK  course_id</text>
    <text x="175" y="60" class="type">INT</text>
    <line x1="15" y1="72" x2="245" y2="72" stroke="#334155" stroke-width="1"/>
    <text x="15" y="95" class="fk">FK  from_lang</text>
    <text x="175" y="95" class="type">VARCHAR(5)</text>
    <text x="15" y="120" class="fk">FK  learning_lang</text>
    <text x="175" y="120" class="type">VARCHAR(5)</text>
    <text x="15" y="145" class="attr">    title</text>
    <text x="175" y="145" class="type">VARCHAR(100)</text>
    <text x="15" y="170" class="attr">    launched_on</text>
    <text x="175" y="170" class="type">DATE</text>
  </g>

  <!-- 3. UNITS -->
  <g transform="translate(720, 100)" filter="url(#shadow)">
    <rect width="260" height="190" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <path d="M 0 0 h 260 v 36 h -260 z" fill="#1d4ed8" rx="8"/>
    <text x="15" y="24" class="entity-header">units</text>
    <text x="15" y="60" class="pk">PK  unit_id</text>
    <text x="175" y="60" class="type">INT</text>
    <line x1="15" y1="72" x2="245" y2="72" stroke="#334155" stroke-width="1"/>
    <text x="15" y="95" class="fk">FK  course_id</text>
    <text x="175" y="95" class="type">INT</text>
    <text x="15" y="120" class="attr">    unit_no</text>
    <text x="175" y="120" class="type">INT</text>
    <text x="15" y="145" class="attr">    title</text>
    <text x="175" y="145" class="type">VARCHAR(100)</text>
    <text x="15" y="170" class="attr">    cefr_level</text>
    <text x="175" y="170" class="type">VARCHAR(10)</text>
  </g>

  <!-- 4. LESSONS -->
  <g transform="translate(1060, 100)" filter="url(#shadow)">
    <rect width="260" height="190" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <path d="M 0 0 h 260 v 36 h -260 z" fill="#1d4ed8" rx="8"/>
    <text x="15" y="24" class="entity-header">lessons</text>
    <text x="15" y="60" class="pk">PK  lesson_id</text>
    <text x="175" y="60" class="type">INT</text>
    <line x1="15" y1="72" x2="245" y2="72" stroke="#334155" stroke-width="1"/>
    <text x="15" y="95" class="fk">FK  unit_id</text>
    <text x="175" y="95" class="type">INT</text>
    <text x="15" y="120" class="attr">    lesson_no</text>
    <text x="175" y="120" class="type">INT</text>
    <text x="15" y="145" class="attr">    lesson_type</text>
    <text x="175" y="145" class="type">VARCHAR(20)</text>
    <text x="15" y="170" class="attr">    xp_value</text>
    <text x="175" y="170" class="type">INT</text>
  </g>

  <!-- 5. ENROLLMENTS -->
  <g transform="translate(380, 390)" filter="url(#shadow)">
    <rect width="260" height="190" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <path d="M 0 0 h 260 v 36 h -260 z" fill="#059669" rx="8"/>
    <text x="15" y="24" class="entity-header">enrollments</text>
    <text x="15" y="60" class="pk">PK,FK  learner_id</text>
    <text x="185" y="60" class="type">INT</text>
    <text x="15" y="85" class="pk">PK,FK  course_id</text>
    <text x="185" y="85" class="type">INT</text>
    <line x1="15" y1="97" x2="245" y2="97" stroke="#334155" stroke-width="1"/>
    <text x="15" y="120" class="attr">       enrolled_at</text>
    <text x="155" y="120" class="type">TIMESTAMPTZ</text>
    <text x="15" y="145" class="attr">       total_xp</text>
    <text x="185" y="145" class="type">INT</text>
    <text x="15" y="170" class="attr">       is_active</text>
    <text x="185" y="170" class="type">BOOLEAN</text>
  </g>

  <!-- 6. LEARNERS (Central Entity) -->
  <g transform="translate(720, 390)" filter="url(#shadow)">
    <rect width="260" height="265" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <path d="M 0 0 h 260 v 36 h -260 z" fill="#d97706" rx="8"/>
    <text x="15" y="24" class="entity-header">learners</text>
    <text x="15" y="60" class="pk">PK  learner_id</text>
    <text x="175" y="60" class="type">INT</text>
    <line x1="15" y1="72" x2="245" y2="72" stroke="#334155" stroke-width="1"/>
    <text x="15" y="95" class="attr">    username (UQ)</text>
    <text x="175" y="95" class="type">VARCHAR(50)</text>
    <text x="15" y="120" class="attr">    email (UQ)</text>
    <text x="175" y="120" class="type">VARCHAR(100)</text>
    <text x="15" y="145" class="attr">    country_code</text>
    <text x="175" y="145" class="type">VARCHAR(5)</text>
    <text x="15" y="170" class="attr">    daily_goal_xp</text>
    <text x="175" y="170" class="type">INT</text>
    <text x="15" y="195" class="attr">    subscription</text>
    <text x="175" y="195" class="type">VARCHAR(20)</text>
    <text x="15" y="220" class="fk">FK  referred_by</text>
    <text x="175" y="220" class="type">INT</text>
    <text x="15" y="245" class="attr">    joined_at</text>
    <text x="155" y="245" class="type">TIMESTAMPTZ</text>
  </g>

  <!-- 7. LESSON_ATTEMPTS -->
  <g transform="translate(1060, 390)" filter="url(#shadow)">
    <rect width="260" height="315" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <path d="M 0 0 h 260 v 36 h -260 z" fill="#1d4ed8" rx="8"/>
    <text x="15" y="24" class="entity-header">lesson_attempts</text>
    <text x="15" y="60" class="pk">PK  attempt_id</text>
    <text x="175" y="60" class="type">BIGINT</text>
    <line x1="15" y1="72" x2="245" y2="72" stroke="#334155" stroke-width="1"/>
    <text x="15" y="95" class="fk">FK  learner_id</text>
    <text x="175" y="95" class="type">INT</text>
    <text x="15" y="120" class="fk">FK  lesson_id</text>
    <text x="175" y="120" class="type">INT</text>
    <text x="15" y="145" class="attr">    started_at</text>
    <text x="155" y="145" class="type">TIMESTAMPTZ</text>
    <text x="15" y="170" class="attr">    completed_at</text>
    <text x="155" y="170" class="type">TIMESTAMPTZ</text>
    <text x="15" y="195" class="attr">    mistakes</text>
    <text x="175" y="195" class="type">INT</text>
    <text x="15" y="220" class="attr">    hearts_lost</text>
    <text x="175" y="220" class="type">INT</text>
    <text x="15" y="245" class="attr">    xp_earned</text>
    <text x="175" y="245" class="type">INT</text>
    <text x="15" y="270" class="attr">    is_perfect</text>
    <text x="175" y="270" class="type">BOOLEAN</text>
    <text x="15" y="295" class="attr">    device</text>
    <text x="175" y="295" class="type">VARCHAR(20)</text>
  </g>

  <!-- 8. DAILY_ACTIVITY -->
  <g transform="translate(380, 780)" filter="url(#shadow)">
    <rect width="260" height="190" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <path d="M 0 0 h 260 v 36 h -260 z" fill="#059669" rx="8"/>
    <text x="15" y="24" class="entity-header">daily_activity</text>
    <text x="15" y="60" class="pk">PK,FK  learner_id</text>
    <text x="185" y="60" class="type">INT</text>
    <text x="15" y="85" class="pk">PK     activity_date</text>
    <text x="185" y="85" class="type">DATE</text>
    <line x1="15" y1="97" x2="245" y2="97" stroke="#334155" stroke-width="1"/>
    <text x="15" y="120" class="attr">       xp</text>
    <text x="185" y="120" class="type">INT</text>
    <text x="15" y="145" class="attr">       lessons_completed</text>
    <text x="185" y="145" class="type">INT</text>
    <text x="15" y="170" class="attr">       used_streak_freeze</text>
    <text x="185" y="170" class="type">BOOLEAN</text>
  </g>

  <!-- 9. LEAGUE_MEMBERSHIPS -->
  <g transform="translate(720, 780)" filter="url(#shadow)">
    <rect width="260" height="240" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <path d="M 0 0 h 260 v 36 h -260 z" fill="#059669" rx="8"/>
    <text x="15" y="24" class="entity-header">league_memberships</text>
    <text x="15" y="60" class="pk">PK,FK  learner_id</text>
    <text x="185" y="60" class="type">INT</text>
    <text x="15" y="85" class="pk">PK     week_start</text>
    <text x="185" y="85" class="type">DATE</text>
    <line x1="15" y1="97" x2="245" y2="97" stroke="#334155" stroke-width="1"/>
    <text x="15" y="120" class="attr">       tier</text>
    <text x="175" y="120" class="type">VARCHAR(20)</text>
    <text x="15" y="145" class="attr">       cohort_id</text>
    <text x="175" y="145" class="type">BIGINT</text>
    <text x="15" y="170" class="attr">       weekly_xp</text>
    <text x="175" y="170" class="type">INT</text>
    <text x="15" y="195" class="attr">       final_rank</text>
    <text x="175" y="195" class="type">INT</text>
    <text x="15" y="220" class="attr">       result</text>
    <text x="175" y="220" class="type">VARCHAR(20)</text>
  </g>

  <!-- 10. LEARNER_ACHIEVEMENTS -->
  <g transform="translate(1060, 780)" filter="url(#shadow)">
    <rect width="260" height="165" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <path d="M 0 0 h 260 v 36 h -260 z" fill="#059669" rx="8"/>
    <text x="15" y="24" class="entity-header">learner_achievements</text>
    <text x="15" y="60" class="pk">PK,FK  learner_id</text>
    <text x="185" y="60" class="type">INT</text>
    <text x="15" y="85" class="pk">PK,FK  achievement_id</text>
    <text x="185" y="85" class="type">INT</text>
    <line x1="15" y1="97" x2="245" y2="97" stroke="#334155" stroke-width="1"/>
    <text x="15" y="120" class="attr">       earned_at</text>
    <text x="155" y="120" class="type">TIMESTAMPTZ</text>
  </g>

  <!-- 11. ACHIEVEMENTS -->
  <g transform="translate(1420, 780)" filter="url(#shadow)">
    <rect width="260" height="165" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <path d="M 0 0 h 260 v 36 h -260 z" fill="#1d4ed8" rx="8"/>
    <text x="15" y="24" class="entity-header">achievements</text>
    <text x="15" y="60" class="pk">PK  achievement_id</text>
    <text x="175" y="60" class="type">INT</text>
    <line x1="15" y1="72" x2="245" y2="72" stroke="#334155" stroke-width="1"/>
    <text x="15" y="95" class="attr">    code (UQ)</text>
    <text x="175" y="95" class="type">VARCHAR(50)</text>
    <text x="15" y="120" class="attr">    name</text>
    <text x="175" y="120" class="type">VARCHAR(100)</text>
  </g>

</svg>